services:
  postgres:
    image: postgres:16-alpine
    container_name: historygraph-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: historygraph
      POSTGRES_PASSWORD: historygraph
      POSTGRES_DB: historygraph_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
